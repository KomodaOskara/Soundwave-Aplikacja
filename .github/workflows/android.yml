name: Zbuduj aplikację Android (APK)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Skonfiguruj JDK dla Androida
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Zainstaluj zależności npm
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/android@6 --legacy-peer-deps
          npm install -D @capacitor/assets --legacy-peer-deps

      # ── KLUCZOWE: zawsze świeży android/ ─────────────────────────────────
      # Stary android/ w repo miał już SoundWaveNative z poprzedniego builda
      # (z jednym try-catch gdzie exception blokowała addJavascriptInterface).
      # Workflow widział 'SoundWaveNative' w pliku i pomijał patching.
      # Rozwiązanie: zawsze regeneruj — gwarantuje czyste MainActivity.java.
      - name: Usuń stary android/ i wygeneruj świeży
        run: |
          rm -rf android
          npx cap add android

      - name: Instalacja Pillow
        run: python3 -m pip install Pillow

      - name: Przygotowanie ikon
        run: |
          python3 - <<EOF
          import os
          from PIL import Image
          icon_path = None
          for root, dirs, files in os.walk('.'):
              if any(p in root for p in ['node_modules','android','.git','.github','assets']): continue
              for f in files:
                  if f.lower() == 'icon.png': icon_path = os.path.join(root, f); break
              if icon_path: break
          if not icon_path: print("BŁĄD: brak icon.png"); exit(1)
          img = Image.open(icon_path)
          os.makedirs('assets', exist_ok=True)
          for n in ['icon-only','icon-foreground','icon-background','splash','splash-dark']:
              img.save(f'assets/{n}.png','PNG')
          img.save('icon.png','PNG'); img.save('splash.png','PNG')
          print(f"OK: {icon_path}")
          EOF

      - name: Wygeneruj ikony
        run: npx @capacitor/assets generate --android

      - name: Natywny MediaSession + JavascriptInterface + uprawnienia
        run: |
          python3 - <<'PYEOF'
          import os, glob

          # ── 1. Uprawnienia ───────────────────────────────────────────────
          manifest = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest) as f: m = f.read()
          perms = """
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
          <uses-permission android:name="android.permission.WAKE_LOCK"/>
          <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>"""
          if 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' not in m:
              m = m.replace('</manifest>', perms + '\n</manifest>')
          with open(manifest, 'w') as f: f.write(m)
          print('✓ Uprawnienia OK')

          # ── 2. MainActivity.java — świeży plik, zawsze patchujemy ────────
          java_files = glob.glob('android/app/src/main/java/**/*.java', recursive=True)
          main_activity = next((f for f in java_files if 'MainActivity' in f), None)
          assert main_activity, 'MainActivity.java nie znaleziony!'
          print(f'Patchuję: {main_activity}')

          with open(main_activity) as f: j = f.read()

          # Importy
          imports = ('import android.media.session.MediaSession;\n'
                     'import android.media.session.PlaybackState;\n'
                     'import android.media.MediaMetadata;\n'
                     'import android.webkit.WebSettings;\n'
                     'import android.os.Handler;\n'
                     'import android.os.Looper;\n')
          j = j.replace('import com.getcapacitor.BridgeActivity;',
                        'import com.getcapacitor.BridgeActivity;\n' + imports)

          # Pole klasy
          j = j.replace(
              'public class MainActivity extends BridgeActivity {',
              'public class MainActivity extends BridgeActivity {\n'
              '    private MediaSession mMediaSession;\n'
              '    private final Handler mMainHandler = new Handler(Looper.getMainLooper());')

          # Główny setup — dwa NIEZALEŻNE try-catch
          setup = r'''
              // ════ BLOK 1: JavascriptInterface (KRYTYCZNY) ════════════════
              // Osobny try-catch: zawsze działa niezależnie od MediaSession.
              // Bez tego window.SoundWaveNative = undefined.
              try {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().getSettings()
                          .setMediaPlaybackRequiresUserGesture(false);
                      getBridge().getWebView().addJavascriptInterface(
                          new SoundWaveBridge(), "SoundWaveNative");
                      android.util.Log.d("SW", "JavascriptInterface OK");
                  }
              } catch (Exception e1) {
                  android.util.Log.e("SW", "JavascriptInterface FAILED: " + e1);
              }

              // ════ BLOK 2: Natywny MediaSession (opcjonalny) ══════════════
              try {
                  mMediaSession = new MediaSession(this, "SoundWavePlayer");
                  mMediaSession.setActive(true);
                  mMediaSession.setPlaybackState(new PlaybackState.Builder()
                      .setActions(PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE
                          | PlaybackState.ACTION_SKIP_TO_NEXT
                          | PlaybackState.ACTION_SKIP_TO_PREVIOUS
                          | PlaybackState.ACTION_SEEK_TO)
                      .setState(PlaybackState.STATE_NONE,
                                PlaybackState.PLAYBACK_POSITION_UNKNOWN, 1.0f)
                      .build());
                  final MediaSession.Callback cb = new MediaSession.Callback() {
                      private void js(String code) {
                          mMainHandler.post(() -> {
                              if (getBridge() != null && getBridge().getWebView() != null)
                                  getBridge().getWebView().evaluateJavascript(
                                      "try{" + code + "}catch(e){}", null);
                          });
                      }
                      @Override public void onPlay()           { js("window._swNativePlay&&_swNativePlay()"); }
                      @Override public void onPause()          { js("window._swNativePause&&_swNativePause()"); }
                      @Override public void onSkipToNext()     { js("window._swNativeNext&&_swNativeNext()"); }
                      @Override public void onSkipToPrevious() { js("window._swNativePrev&&_swNativePrev()"); }
                      @Override public void onSeekTo(long ms)  { js("window._swNativeSeek&&_swNativeSeek("+ms+")"); }
                  };
                  mMediaSession.setCallback(cb);
                  android.util.Log.d("SW", "MediaSession OK");
              } catch (Exception e2) {
                  android.util.Log.e("SW", "MediaSession FAILED: " + e2);
              }'''

          j = j.replace('super.onCreate(savedInstanceState);',
                        'super.onCreate(savedInstanceState);' + setup)

          # Inner class SoundWaveBridge (nazwana, nie anonimowa — lepsza zgodność z Android)
          bridge_class = r'''
              // ─── SoundWaveBridge: named inner class dla pewnego JavascriptInterface ───
              // Anonimowe klasy mogą mieć problemy z @JavascriptInterface w niektórych
              // wersjach Android. Nazwana klasa wewnętrzna jest bardziej niezawodna.
              class SoundWaveBridge {
                  @android.webkit.JavascriptInterface
                  public boolean isAvailable() { return true; }

                  @android.webkit.JavascriptInterface
                  public void setMetadata(final String title, final String artist) {
                      mMainHandler.post(() -> {
                          if (mMediaSession == null) return;
                          try {
                              mMediaSession.setMetadata(new MediaMetadata.Builder()
                                  .putString(MediaMetadata.METADATA_KEY_TITLE,
                                             title  != null ? title  : "")
                                  .putString(MediaMetadata.METADATA_KEY_ARTIST,
                                             artist != null ? artist : "")
                                  .putString(MediaMetadata.METADATA_KEY_ALBUM, "SoundWave")
                                  .build());
                          } catch (Exception ignored) {}
                      });
                  }

                  @android.webkit.JavascriptInterface
                  public void setPlaybackState(final String state,
                                               final long posMs, final long durMs) {
                      mMainHandler.post(() -> {
                          if (mMediaSession == null) return;
                          try {
                              int s = "playing".equals(state) ?
                                  PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED;
                              mMediaSession.setPlaybackState(new PlaybackState.Builder()
                                  .setActions(PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE
                                      | PlaybackState.ACTION_SKIP_TO_NEXT
                                      | PlaybackState.ACTION_SKIP_TO_PREVIOUS
                                      | PlaybackState.ACTION_SEEK_TO)
                                  .setState(s, posMs, 1.0f)
                                  .build());
                          } catch (Exception ignored) {}
                      });
                  }
              }'''

          # onDestroy
          destroy = '''
              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (mMediaSession != null) {
                      try { mMediaSession.setActive(false); mMediaSession.release(); }
                      catch (Exception ignored) {}
                      mMediaSession = null;
                  }
              }'''

          # Wstaw inner class i onDestroy przed ostatnią }
          last = j.rfind('}')
          j = j[:last] + bridge_class + destroy + '\n}'

          with open(main_activity, 'w') as f: f.write(j)
          print('✓ MainActivity.java patchowany')

          # ── 3. network_security_config.xml ──────────────────────────────
          os.makedirs('android/app/src/main/res/xml', exist_ok=True)
          with open('android/app/src/main/res/xml/network_security_config.xml','w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n'
                      '<network-security-config>\n'
                      '  <domain-config cleartextTrafficPermitted="false">\n'
                      '    <domain includeSubdomains="true">muzyka.komodaoskara.pl</domain>\n'
                      '  </domain-config>\n'
                      '</network-security-config>')
          print('✓ Wszystko OK')
          PYEOF

      - name: Zsynchronizuj frontend
        run: npx cap sync android

      - name: Zbuduj APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Soundwave-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
