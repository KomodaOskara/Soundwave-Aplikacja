name: Zbuduj aplikację Android (APK)

# ══════════════════════════════════════════════════════════════════════════════
# WERSJA v102 — naprawiony MediaSession na Androidzie
#
# CO BYŁO NIE TAK:
# WebView Androida NIE implementuje Media Session Web API. `navigator.mediaSession`
# jest tam po prostu undefined — dlatego apka logowała "MediaSession NOT supported
# in this browser/mode" i nie było ani kontrolek na ekranie blokady, ani metadanych
# w powiadomieniu. Na iOS działało, bo tam WebView to WebKit z pełnym wsparciem.
#
# Poprzednia wersja workflowu ustawiała tylko AudioFocus (dźwięk w tle grał, ale
# bez kontrolek) i świadomie rezygnowała z JavascriptInterface. Zostawiało to
# aplikację BEZ jakiegokolwiek backendu MediaSession.
#
# CO ROBI TA WERSJA:
# Instaluje natywny plugin @jofr/capacitor-media-session (Capacitor 6). Plugin
# stawia prawdziwą androidową MediaSessionCompat + foreground service z
# powiadomieniem MediaStyle — czyli kontrolki na ekranie blokady, w powiadomieniach,
# na słuchawkach BT i w samochodzie.
#
# Bundler NIE jest potrzebny: bridge Capacitora sam wystawia
# window.Capacitor.Plugins.MediaSession na podstawie PluginHeaders, a frontend
# (index.html v102) właśnie tego szuka.
#
# WYMAGANE: www/index.html musi być w wersji v102 — starsze wydania miały
# w updateMediaSession() guard `if (!_hasNativeMS && !_msPlugin) return;`,
# który wycinał ścieżkę pluginu, więc sama instalacja pluginu nic by nie dała.
# ══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      android_auto:
        description: 'Wsparcie Android Auto (natywny odtwarzacz media3)'
        type: boolean
        default: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Skonfiguruj JDK dla Androida
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Zainstaluj zależności npm
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/android@6 --legacy-peer-deps
          # Plugin MediaSession — MUSI być zainstalowany PRZED `cap add android`,
          # żeby projekt androidowy wciągnął go jako moduł natywny.
          npm install @jofr/capacitor-media-session@4 --legacy-peer-deps
          npm install -D @capacitor/assets --legacy-peer-deps

      - name: Usuń stary android/ i wygeneruj świeży
        run: |
          rm -rf android
          npx cap add android

      - name: Sprawdź czy plugin MediaSession został wpięty
        run: |
          echo "── Wpięte pluginy Capacitora ──"
          cat android/capacitor.settings.gradle
          if ! grep -q "capacitor-media-session" android/capacitor.settings.gradle; then
            echo "❌ BŁĄD: plugin @jofr/capacitor-media-session NIE został wpięty do projektu."
            echo "   Bez niego APK znowu nie będzie miał kontrolek na ekranie blokady."
            exit 1
          fi
          echo "✅ Plugin MediaSession wpięty poprawnie"

      - name: Instalacja Pillow
        run: python3 -m pip install Pillow

      - name: Przygotowanie ikon
        run: |
          python3 - <<EOF
          import os
          from PIL import Image
          icon_path = None
          for root, dirs, files in os.walk('.'):
              if any(p in root for p in ['node_modules','android','.git','.github','assets']): continue
              for f in files:
                  if f.lower() == 'icon.png': icon_path = os.path.join(root, f); break
              if icon_path: break
          if not icon_path: print("BŁĄD: brak icon.png"); exit(1)
          img = Image.open(icon_path)
          os.makedirs('assets', exist_ok=True)
          for n in ['icon-only','icon-foreground','icon-background','splash','splash-dark']:
              img.save(f'assets/{n}.png','PNG')
          img.save('icon.png','PNG'); img.save('splash.png','PNG')
          print(f"OK: {icon_path}")
          EOF

      - name: Wygeneruj ikony
        run: npx @capacitor/assets generate --android

      - name: "Konfiguracja Android - uprawnienia + AudioFocus + WebView"
        run: |
          python3 - <<'PYEOF'
          import os, glob, re

          # ── 1. Uprawnienia ────────────────────────────────────────────────
          manifest = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest) as f: m = f.read()

          needed = [
              'android.permission.FOREGROUND_SERVICE',
              # Wymagane od Androida 14 dla foreground service typu mediaPlayback
              # (plugin deklaruje foregroundServiceType="mediaPlayback").
              'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
              'android.permission.WAKE_LOCK',
              'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
              # KLUCZOWE od Androida 13: bez POST_NOTIFICATIONS powiadomienie
              # foreground service NIE jest pokazywane — usługa działa, ale
              # kontrolek na ekranie blokady nie widać. Tego brakowało wcześniej.
              'android.permission.POST_NOTIFICATIONS',
          ]
          add = ''.join(
              f'\n    <uses-permission android:name="{p}"/>'
              for p in needed if p not in m
          )
          if add:
              m = m.replace('</manifest>', add + '\n</manifest>')
          with open(manifest, 'w') as f: f.write(m)
          print('✓ Uprawnienia OK')

          # ── 2. MainActivity.java ──────────────────────────────────────────
          # AudioFocus + ustawienia WebView + prośba o POST_NOTIFICATIONS.
          # Sam MediaSession obsługuje plugin — tu go nie dotykamy.
          java_files = glob.glob('android/app/src/main/java/**/*.java', recursive=True)
          main_activity = next((f for f in java_files if 'MainActivity' in f), None)
          assert main_activity, 'MainActivity.java nie znaleziony!'

          with open(main_activity) as f: j = f.read()

          # Capacitor generuje klase PUSTA: `public class MainActivity extends
          # BridgeActivity {}`. Nie ma w niej zadnego onCreate, wiec kazda latka
          # szukajaca `super.onCreate(savedInstanceState);` byla dotad cicho
          # pomijana - AudioFocus i ustawienia WebView NIGDY nie trafily do APK.
          # Najpierw wiec dopisujemy szkielet onCreate, a dopiero potem laty.
          if 'onCreate' not in j:
              j = re.sub(r'public class MainActivity extends BridgeActivity\s*\{\s*\}',
                         'public class MainActivity extends BridgeActivity {\n'
                         '    @Override\n'
                         '    public void onCreate(android.os.Bundle savedInstanceState) {\n'
                         '        super.onCreate(savedInstanceState);\n'
                         '    }\n'
                         '}', j)
              assert 'super.onCreate(savedInstanceState);' in j, \
                     'Nie udalo sie dodac onCreate do MainActivity'
              print('+ dodano szkielet onCreate (klasa byla pusta)')

          imports = (
              'import android.media.AudioAttributes;\n'
              'import android.media.AudioFocusRequest;\n'
              'import android.media.AudioManager;\n'
              'import android.webkit.WebSettings;\n'
          )
          j = j.replace('import com.getcapacitor.BridgeActivity;',
                        'import com.getcapacitor.BridgeActivity;\n' + imports)

          j = j.replace(
              'public class MainActivity extends BridgeActivity {',
              'public class MainActivity extends BridgeActivity {\n'
              '    private AudioFocusRequest mAudioFocusRequest;\n')

          setup = r'''
              // ── WebView: audio bez gestu użytkownika ────────────────────
              try {
                  getBridge().getWebView().getSettings()
                      .setMediaPlaybackRequiresUserGesture(false);
                  getBridge().getWebView().getSettings()
                      .setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
              } catch (Exception e) { e.printStackTrace(); }

              // ── POST_NOTIFICATIONS (Android 13+) ────────────────────────
              // Plugin MediaSession pokazuje kontrolki przez powiadomienie
              // foreground service. Od API 33 bez zgody użytkownika to
              // powiadomienie jest po cichu ukrywane — czyli brak kontrolek
              // na ekranie blokady mimo działającego serwisu.
              try {
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission("android.permission.POST_NOTIFICATIONS")
                              != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(
                              new String[]{"android.permission.POST_NOTIFICATIONS"}, 8801);
                      }
                  }
              } catch (Exception e) { e.printStackTrace(); }

              // ── AudioFocus ──────────────────────────────────────────────
              // Plugin MediaSession sam NIE prosi o audio focus, więc zostaje
              // to tutaj: mówi Androidowi "jesteśmy odtwarzaczem muzyki",
              // dzięki czemu system nie wycisza nas w tle.
              try {
                  AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                  mAudioFocusRequest = new AudioFocusRequest.Builder(
                          AudioManager.AUDIOFOCUS_GAIN)
                      .setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                          .build())
                      .setWillPauseWhenDucked(false)
                      .setAcceptsDelayedFocusGain(true)
                      .setOnAudioFocusChangeListener(focusChange -> {
                          android.util.Log.d("SW", "AudioFocus change: " + focusChange);
                      })
                      .build();
                  int result = am.requestAudioFocus(mAudioFocusRequest);
                  android.util.Log.d("SW", "AudioFocus result: " + result);
              } catch (Exception e) {
                  android.util.Log.e("SW", "AudioFocus FAILED: " + e);
              }'''

          j = j.replace('super.onCreate(savedInstanceState);',
                        'super.onCreate(savedInstanceState);' + setup)

          destroy = '''
              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try {
                      if (mAudioFocusRequest != null) {
                          AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                          am.abandonAudioFocusRequest(mAudioFocusRequest);
                      }
                  } catch (Exception ignored) {}
              }'''
          last = j.rfind('}')
          j = j[:last] + destroy + '\n}'

          with open(main_activity, 'w') as f: f.write(j)
          print(f'✓ MainActivity zaktualizowany: {main_activity}')

          # ── 3. network_security_config.xml ──────────────────────────────
          os.makedirs('android/app/src/main/res/xml', exist_ok=True)
          with open('android/app/src/main/res/xml/network_security_config.xml','w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n'
                      '  <domain-config cleartextTrafficPermitted="false">\n'
                      '    <domain includeSubdomains="true">muzyka.komodaoskara.pl</domain>\n'
                      '  </domain-config>\n</network-security-config>')
          print('✓ Wszystko gotowe')
          PYEOF

      - name: "Android Auto - natywny odtwarzacz (media3)"
        if: ${{ inputs.android_auto }}
        run: |
          set -e
          PKG_DIR=$(dirname "$(find android/app/src/main/java -name MainActivity.java | head -1)")
          echo "Pakiet aplikacji: $PKG_DIR"

          # Zrodla natywne trzymamy jako PLIKI w repo (katalog native/), a nie
          # jako latki tekstowe w tym workflow - kilkaset linii Javy sklejanej
          # stringami byloby nie do utrzymania.
          cp native/SoundwaveAuth.java         "$PKG_DIR/"
          cp native/SoundwaveApi.java          "$PKG_DIR/"
          cp native/SoundwaveMediaService.java "$PKG_DIR/"
          mkdir -p android/app/src/main/res/xml
          cp native/automotive_app_desc.xml android/app/src/main/res/xml/

          cat > /tmp/auto_patch.py <<'AUTOPATCH'
          import glob

          # ---- build.gradle: media3 przypiete na 1.4.1 ----------------------
          # 1.5+ wymaga compileSdk 35, a Capacitor 6 ustawia 34. To ostatnia
          # wersja dzialajaca bez ruszania konfiguracji Capacitora.
          gp = "android/app/build.gradle"
          g = open(gp).read()
          if "media3-session" not in g:
              g = g.replace("dependencies {",
                            'dependencies {\n'
                            '    implementation "androidx.media3:media3-exoplayer:1.4.1"\n'
                            '    implementation "androidx.media3:media3-session:1.4.1"', 1)
          # API sesji media3 jest oznaczone jako niestabilne - bez tego lint
          # potrafi wywalic build na UnsafeOptInUsageError.
          if "abortOnError false" not in g:
              g = g.replace("android {",
                            "android {\n    lint {\n        abortOnError false\n    }", 1)
          open(gp, "w").write(g)
          print("OK build.gradle")

          # ---- AndroidManifest: serwis + deklaracja dla Auto ----------------
          mp = "android/app/src/main/AndroidManifest.xml"
          m = open(mp).read()
          if "SoundwaveMediaService" not in m:
              svc = (
                  '\n        <service\n'
                  '            android:name=".SoundwaveMediaService"\n'
                  '            android:exported="true"\n'
                  '            android:foregroundServiceType="mediaPlayback">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="androidx.media3.session.MediaLibraryService" />\n'
                  '                <action android:name="android.media.browse.MediaBrowserService" />\n'
                  '            </intent-filter>\n'
                  '        </service>\n\n'
                  '        <meta-data\n'
                  '            android:name="com.google.android.gms.car.application"\n'
                  '            android:resource="@xml/automotive_app_desc" />\n'
              )
              m = m.replace("</application>", svc + "    </application>", 1)
              open(mp, "w").write(m)
          print("OK AndroidManifest")

          # ---- MainActivity: podanie WebView i danych logowania -------------
          ma = [f for f in glob.glob("android/app/src/main/java/**/*.java", recursive=True)
                if "MainActivity" in f][0]
          j = open(ma).read()
          # Zabezpieczenie na wypadek uruchomienia bez wczesniejszego kroku
          # konfiguracji - bez onCreate nie ma gdzie wstrzykiwac.
          assert "super.onCreate(savedInstanceState);" in j, \
                 "MainActivity nie ma onCreate - krok konfiguracji nie wykonal sie poprawnie"
          if "SoundwaveMediaService.attachWebView" not in j:
              j = j.replace("super.onCreate(savedInstanceState);",
                  "super.onCreate(savedInstanceState);\n"
                  "\n"
                  "        // Android Auto: natywny odtwarzacz musi umiec wyciszyc WebView,\n"
                  "        // zeby dwa odtwarzacze nie graly jednoczesnie.\n"
                  "        try {\n"
                  "            SoundwaveMediaService.attachWebView(getBridge().getWebView());\n"
                  "        } catch (Exception e) { e.printStackTrace(); }", 1)
              extra = (
                  "\n"
                  "    @Override\n"
                  "    public void onResume() {\n"
                  "        super.onResume();\n"
                  "        try {\n"
                  "            final android.webkit.WebView wv = getBridge().getWebView();\n"
                  "            SoundwaveAuth.syncFromWebView(this, wv);\n"
                  "            // Przy zimnym starcie strona bywa jeszcze niezaladowana i nie ma\n"
                  "            // tokenu w localStorage - druga proba po chwili to domyka.\n"
                  "            wv.postDelayed(new Runnable() {\n"
                  "                @Override public void run() {\n"
                  "                    SoundwaveAuth.syncFromWebView(MainActivity.this, wv);\n"
                  "                }\n"
                  "            }, 5000);\n"
                  "        } catch (Exception e) { e.printStackTrace(); }\n"
                  "    }\n"
              )
              last = j.rfind("}")
              j = j[:last] + extra + "}\n"
              open(ma, "w").write(j)
          print("OK MainActivity")
          AUTOPATCH
          python3 /tmp/auto_patch.py

      - name: "Android Auto - kontrola przed buildem"
        if: ${{ inputs.android_auto }}
        run: |
          PKG_DIR=$(dirname "$(find android/app/src/main/java -name MainActivity.java | head -1)")
          for f in SoundwaveAuth.java SoundwaveApi.java SoundwaveMediaService.java; do
            test -f "$PKG_DIR/$f" || { echo "BRAK $f"; exit 1; }
          done
          test -f android/app/src/main/res/xml/automotive_app_desc.xml || { echo "BRAK automotive_app_desc.xml"; exit 1; }
          grep -q SoundwaveMediaService android/app/src/main/AndroidManifest.xml || { echo "BRAK serwisu w manifescie"; exit 1; }
          grep -q media3-session android/app/build.gradle || { echo "BRAK zaleznosci media3"; exit 1; }
          grep -q attachWebView "$PKG_DIR/MainActivity.java" || { echo "MainActivity nie zostal zalatany"; exit 1; }
          echo "Wszystkie elementy Android Auto na miejscu"

      - name: Zsynchronizuj frontend
        run: npx cap sync android

      - name: Zbuduj APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Soundwave-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
