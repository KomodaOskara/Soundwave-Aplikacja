[package]
name = "soundwave-cli"
version = "0.2.0"
edition = "2024"
description = "Lekki terminalowy odtwarzacz dla SoundWave (Linux + Windows)"

[[bin]]
name = "soundwave-cli"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
